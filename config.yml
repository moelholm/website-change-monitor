# Website Change Monitor Configuration
# Define websites to monitor for changes

jobs:
  - jobname: hotelskansen-kullamannen-package
    url: https://hotelskansen.se/erbjudanden-paket/
    pattern: "Kullamannen"
    action: when-text-appears

  - jobname: utmb-kullamannen-ultra-100-miles-sold-out
    url: https://kullamannen.utmb.world/races/ultra-100-miles
    pattern: "sold\\s+out"
    action: when-text-disappears

  - jobname: sportstiming-event-17984-results-round-106242
    url: https://www.sportstiming.dk/event/17984/results?round=106242
    pattern: "No results found"
    action: when-text-disappears
